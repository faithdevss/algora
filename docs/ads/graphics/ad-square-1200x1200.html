<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Algora — Google Ads square image asset (1200×1200, 1:1)</title>
<!--
  Source for ad-square-1200x1200.png. Render with build.sh. Same rules as the
  landscape file: no alpha, no counts burned into the art.

  Three real screenshots, fanned: Algora_30.png (the Practice hub, for its
  colour), Algora_33.png (the graph two-colouring lab, front) and Algora_26.png
  (the tree lab, with runnable Kotlin above it).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<style>
  html, body, .canvas { width: 1200px; height: 1200px; }

  .brand    { position: absolute; left: 0; top: 104px; width: 1200px;
              display: flex; align-items: center; justify-content: center; gap: 22px; }
  .wordmark { font-size: 72px; line-height: 1; }

  .headline { position: absolute; left: 0; top: 236px; width: 1200px;
              padding: 0 130px; text-align: center; font-size: 50px; line-height: 1.16; }
  .sub      { position: absolute; left: 0; top: 380px; width: 1200px;
              padding: 0 190px; text-align: center; font-size: 24px; line-height: 1.45; }
  .pills    { position: absolute; left: 0; top: 476px; width: 1200px; justify-content: center; }
</style>
</head>
<body>
<div class="canvas">

  <svg class="mark" width="1200" height="1200" viewBox="0 0 1200 1200">
    <g class="edge" stroke-width="20">
      <line x1="1052" y1="112" x2="928"  y2="356"></line>
      <line x1="1052" y1="112" x2="1176" y2="356"></line>
      <line x1="980"  y1="264" x2="1124" y2="264"></line>
    </g>
    <circle class="node" cx="1052" cy="112" r="40"></circle>
    <circle class="node" cx="928"  cy="356" r="32"></circle>
    <circle class="node" cx="1176" cy="356" r="32"></circle>
    <g class="edge" stroke-width="16">
      <line x1="126" y1="150" x2="14"  y2="352"></line>
      <line x1="126" y1="150" x2="238" y2="352"></line>
      <line x1="70"  y1="252" x2="182" y2="252"></line>
    </g>
    <circle class="node" cx="126" cy="150" r="30"></circle>
    <circle class="node" cx="14"  cy="352" r="24"></circle>
    <circle class="node" cx="238" cy="352" r="24"></circle>
  </svg>

  <div class="brand">
    <!-- app icon tile: docs/design/Algora Icon.html, 300-unit artwork at 96px -->
    <svg width="96" height="96" viewBox="0 0 300 300">
      <defs>
        <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"    stop-color="#6366f1"></stop>
          <stop offset="0.52" stop-color="#7c3aed"></stop>
          <stop offset="1"    stop-color="#c026d3"></stop>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="300" height="300" rx="70" fill="url(#ramp)"></rect>
      <g stroke="rgba(255,255,255,.35)" stroke-width="21" stroke-linecap="round">
        <line x1="150" y1="95" x2="78"  y2="240"></line>
        <line x1="150" y1="95" x2="222" y2="240"></line>
        <line x1="105" y1="185" x2="195" y2="185"></line>
      </g>
      <circle cx="150" cy="95"  r="36" fill="#fff"></circle>
      <circle cx="78"  cy="240" r="30" fill="#fff"></circle>
      <circle cx="222" cy="240" r="30" fill="#fff"></circle>
      <circle cx="150" cy="95"  r="14" fill="#5b21b6"></circle>
    </svg>
    <div class="wordmark">Algora</div>
  </div>

  <div class="headline">Algorithms and AI you can actually see</div>
  <div class="sub">Every topic ships with a lab you can run — offline, no account.</div>

  <div class="pills">
    <div class="pill"><span class="dot" style="background:#8b5cf6"></span>DSA &middot; AI</div>
    <div class="pill"><span class="dot" style="background:#3b82f6"></span>Interview prep</div>
    <div class="pill"><span class="dot" style="background:#10b981"></span>Works offline</div>
  </div>

  <!-- Fan: the two outer phones tilt away and sit lower, so the lab in the -->
  <!-- middle is unambiguously the subject.                                  -->
  <div class="phone" style="left: 108px; top: 622px; width: 296px; transform: rotate(-9deg);">
    <img src="../../store/screenshots/Algora_30.png" alt="">
  </div>
  <div class="phone" style="left: 796px; top: 622px; width: 296px; transform: rotate(9deg);">
    <img src="../../store/screenshots/Algora_26.png" alt="">
  </div>
  <div class="phone" style="left: 432px; top: 556px; width: 336px;">
    <img src="../../store/screenshots/Algora_33.png" alt="">
  </div>

</div>
</body>
</html>
