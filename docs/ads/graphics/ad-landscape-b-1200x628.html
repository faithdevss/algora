<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AlgorAI — Google Ads landscape image asset, variant B (1200×628, 1.91:1)</title>
<!--
  Source for ../images/ad-landscape-b-1200x628.png. Render with build.sh.

  Variant B of the required 1.91:1 slot. Two things differ from variant A on
  purpose, so the pair is a real test rather than the same ad twice:

    * the angle — A sells seeing an algorithm run, B sells being drilled on it
    * the layout is mirrored, phones left and text right, so the two are
      distinguishable at a glance in the Ads asset library

  Phones: docs/store/screenshots/Algora_30.png (the Practice hub) and
  Algora_28.png (the labs catalog). The catalog was picked over the progress
  dashboard because a fresh install's dashboard is all zeros, which reads as an
  empty app in an ad. Note Algora_28 has "504 interactive labs" inside the
  screenshot itself — see the count note in ../README.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<style>
  html, body, .canvas { width: 1200px; height: 628px; }

  .tile     { position: absolute; left: 622px; top: 74px; }
  .wordmark { position: absolute; left: 722px; top: 84px; font-size: 62px; line-height: 1; }

  .headline { position: absolute; left: 623px; top: 214px; width: 500px; font-size: 44px; line-height: 1.14; }
  .sub      { position: absolute; left: 623px; top: 372px; width: 505px; font-size: 20px; line-height: 1.45; }
  .pills    { position: absolute; left: 622px; top: 462px; }
</style>
</head>
<body>
<div class="canvas">

  <svg class="mark" width="1200" height="628" viewBox="0 0 1200 628">
    <g class="edge" stroke-width="15">
      <line x1="1088" y1="452" x2="1196" y2="568"></line>
      <line x1="1088" y1="452" x2="1058" y2="622"></line>
      <line x1="1152" y1="512" x2="1068" y2="544"></line>
    </g>
    <circle class="node" cx="1088" cy="452" r="23"></circle>
    <circle class="node" cx="1196" cy="568" r="19"></circle>
    <circle class="node" cx="1058" cy="622" r="19"></circle>
  </svg>

  <!-- app icon tile: docs/design/Algora Icon.html, 300-unit artwork at 88px -->
  <svg class="tile" width="88" height="88" viewBox="0 0 300 300">
    <defs>
      <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"    stop-color="#6366f1"></stop>
        <stop offset="0.52" stop-color="#7c3aed"></stop>
        <stop offset="1"    stop-color="#c026d3"></stop>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="300" height="300" rx="70" fill="url(#ramp)"></rect>
    <g stroke="rgba(255,255,255,.35)" stroke-width="21" stroke-linecap="round">
      <line x1="150" y1="95" x2="78"  y2="240"></line>
      <line x1="150" y1="95" x2="222" y2="240"></line>
      <line x1="105" y1="185" x2="195" y2="185"></line>
    </g>
    <circle cx="150" cy="95"  r="36" fill="#fff"></circle>
    <circle cx="78"  cy="240" r="30" fill="#fff"></circle>
    <circle cx="222" cy="240" r="30" fill="#fff"></circle>
    <circle cx="150" cy="95"  r="14" fill="#5b21b6"></circle>
  </svg>

  <div class="wordmark">AlgorAI</div>
  <div class="headline">Practice, not just reading</div>
  <div class="sub">Pattern-grouped problems, timed rounds and flashcard recall.</div>

  <div class="pills">
    <div class="pill"><span class="dot" style="background:#3b82f6"></span>Problems</div>
    <div class="pill"><span class="dot" style="background:#f59e0b"></span>Timed rounds</div>
    <div class="pill"><span class="dot" style="background:#a855f7"></span>Flashcards</div>
  </div>

  <div class="phone" style="left: 14px; top: 138px; width: 224px; transform: rotate(-7deg);">
    <img src="../../store/screenshots/Algora_28.png" alt="">
  </div>
  <div class="phone" style="left: 232px; top: 96px; width: 262px; transform: rotate(3deg);">
    <img src="../../store/screenshots/Algora_30.png" alt="">
  </div>

</div>
</body>
</html>
