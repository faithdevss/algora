name: AlgorAI
options:
  bundleIdPrefix: com.saimum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  AlgorAI:
    build:
      targets:
        AlgorAI: all
    run:
      storeKitConfiguration: AlgorAI.storekit
targets:
  AlgorAI:
    type: application
    platform: iOS
    sources:
      - path: AlgorAI
    info:
      path: AlgorAI/Info.plist
      properties:
        CFBundleDisplayName: AlgorAI
        UILaunchScreen: {}
        UIAppFonts:
          - ibm_plex_mono_medium.ttf
          - ibm_plex_mono_regular.ttf
          - ibm_plex_sans.ttf
          - space_grotesk.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saimum.algorai
        PRODUCT_NAME: AlgorAI
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
